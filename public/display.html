<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fluid Display</title>
<style>
  :root {
    --bg: #03050a;
    --panel: rgba(10, 13, 24, 0.82);
    --line: rgba(129, 140, 248, 0.32);
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #6366f1;
    --green: #22c55e;
    --red: #ef4444;
    --cols: 1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }

  #standby {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.28), transparent 34%),
      radial-gradient(circle at 80% 70%, rgba(34, 197, 94, 0.12), transparent 30%),
      #070a13;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 20;
    transition: opacity 0.35s ease;
  }
  #standby.hidden { opacity: 0; pointer-events: none; }
  .standby-title { font-size: 58px; font-weight: 800; }
  .standby-sub { color: var(--muted); font-size: 22px; }
  .standby-url {
    margin-top: 16px;
    padding: 16px 28px;
    border: 1px solid var(--line);
    background: rgba(15, 23, 42, 0.72);
    border-radius: 8px;
    text-align: center;
  }
  .standby-url .label { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .standby-url .url { color: #a5b4fc; font-family: "Cascadia Code", Consolas, monospace; font-size: 26px; font-weight: 800; }
  .standby-url .hint { color: #64748b; font-size: 13px; margin-top: 6px; }

  #wall {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    grid-auto-rows: minmax(0, 1fr);
    gap: 10px;
    padding: 10px;
    background: #02030a;
  }
  .tile {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.2);
    background: #000;
  }
  .tile video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #000;
  }
  .tile.waiting {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 18px;
  }
  .tile-label {
    position: absolute;
    left: 14px;
    bottom: 12px;
    max-width: calc(100% - 28px);
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(0, 0, 0, 0.72);
    backdrop-filter: blur(8px);
    border-radius: 6px;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 3px #000;
  }
  .tile-label span {
    display: block;
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
  }

  .conn-status {
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(0, 0, 0, 0.58);
    border-radius: 6px;
    font-size: 13px;
  }
  .conn-status .d { width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .conn-status .d.ok { background: var(--green); }

  .count-badge {
    position: fixed;
    left: 14px;
    top: 14px;
    z-index: 30;
    padding: 8px 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(0, 0, 0, 0.58);
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .count-badge strong { color: var(--text); }
</style>
</head>
<body>
<div class="conn-status">
  <div class="d" id="connDot"></div>
  <span id="connLabel">Connecting...</span>
</div>
<div class="count-badge"><strong id="liveCount">0</strong> live</div>

<div id="standby">
  <div class="standby-title">Fluid</div>
  <div class="standby-sub">Waiting for shared screens...</div>
  <div class="standby-url">
    <div class="label">Connect devices at</div>
    <div class="url" id="serverUrl">-</div>
    <div class="hint">Shared screens appear here automatically</div>
  </div>
</div>

<main id="wall"></main>

<script>
'use strict';

const state = {
  ws: null,
  reconnectDelay: 1000,
  devices: [],
  pcs: new Map(),
};

const standby = document.getElementById('standby');
const wall = document.getElementById('wall');
const serverUrl = document.getElementById('serverUrl');
const connDot = document.getElementById('connDot');
const connLabel = document.getElementById('connLabel');
const liveCount = document.getElementById('liveCount');

function setConnStatus(ok, label) {
  connDot.className = 'd' + (ok ? ' ok' : '');
  connLabel.textContent = label;
}

function escHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getStreamingDevices() {
  return state.devices.filter(d => d.status === 'streaming');
}

function setGrid(count) {
  let cols = 1;
  if (count <= 1) cols = 1;
  else if (count <= 4) cols = 2;
  else if (count <= 9) cols = 3;
  else cols = Math.ceil(Math.sqrt(count));
  document.documentElement.style.setProperty('--cols', String(cols));
}

function publicClientUrl(info) {
  const ips = info?.ips || [];
  const host = ips[0] || location.hostname;
  const port = info?.publicPort && ![80, 443].includes(info.publicPort) ? `:${info.publicPort}` : '';
  return `https://${host}${port}/client.html`;
}

function updateStandby(info) {
  if (info) serverUrl.textContent = publicClientUrl(info);
  const count = getStreamingDevices().length;
  liveCount.textContent = String(count);
  standby.classList.toggle('hidden', count > 0);
}

function tileId(deviceId) {
  return `tile-${String(deviceId).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
}

function ensureTile(device) {
  let tile = document.getElementById(tileId(device.id));
  if (tile) return tile;

  tile = document.createElement('section');
  tile.className = 'tile waiting';
  tile.id = tileId(device.id);
  tile.dataset.deviceId = device.id;
  tile.innerHTML = `
    <div>Connecting ${escHtml(device.name)}...</div>
    <div class="tile-label">${escHtml(device.name)}<span>${escHtml(device.platform || 'Unknown')}</span></div>
  `;
  wall.appendChild(tile);
  return tile;
}

function renderWall() {
  const streaming = getStreamingDevices();
  const streamingIds = new Set(streaming.map(d => d.id));

  for (const tile of [...wall.querySelectorAll('.tile')]) {
    if (!streamingIds.has(tile.dataset.deviceId)) tile.remove();
  }

  for (const device of streaming) {
    const tile = ensureTile(device);
    const label = tile.querySelector('.tile-label');
    if (label) label.innerHTML = `${escHtml(device.name)}<span>${escHtml(device.platform || 'Unknown')}</span>`;
    if (!state.pcs.has(device.id)) initiateRtc(device.id);
  }

  for (const [deviceId] of [...state.pcs]) {
    if (!streamingIds.has(deviceId)) closePeer(deviceId);
  }

  setGrid(streaming.length);
  updateStandby();
}

function closePeer(deviceId) {
  const pc = state.pcs.get(deviceId);
  if (pc) pc.close();
  state.pcs.delete(deviceId);
  document.getElementById(tileId(deviceId))?.remove();
  setGrid(getStreamingDevices().length);
  updateStandby();
}

async function initiateRtc(deviceId) {
  const device = state.devices.find(d => d.id === deviceId);
  if (!device || state.pcs.has(deviceId)) return;

  const pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
    ],
  });
  state.pcs.set(deviceId, pc);
  ensureTile(device);

  pc.addEventListener('track', ev => {
    const tile = ensureTile(device);
    tile.classList.remove('waiting');
    tile.innerHTML = '';

    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    video.muted = true;
    video.srcObject = ev.streams[0];

    const label = document.createElement('div');
    label.className = 'tile-label';
    label.innerHTML = `${escHtml(device.name)}<span>${escHtml(device.platform || 'Unknown')}</span>`;

    tile.append(video, label);
  });

  pc.addEventListener('icecandidate', ev => {
    if (ev.candidate) {
      send({ type: 'rtc-ice', candidate: ev.candidate, targetDeviceId: deviceId });
    }
  });

  pc.addEventListener('connectionstatechange', () => {
    if (['failed', 'closed'].includes(pc.connectionState)) {
      closePeer(deviceId);
    }
  });

  pc.addTransceiver('video', { direction: 'recvonly' });
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  send({ type: 'rtc-offer', offer: pc.localDescription, targetDeviceId: deviceId });
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  state.ws = ws;

  ws.addEventListener('open', () => {
    setConnStatus(true, 'Display connected');
    state.reconnectDelay = 1000;
    send({ type: 'register-display' });
  });

  ws.addEventListener('message', ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  });

  ws.addEventListener('close', () => {
    setConnStatus(false, 'Reconnecting...');
    setTimeout(connect, state.reconnectDelay);
    state.reconnectDelay = Math.min(state.reconnectDelay * 1.5, 15000);
  });
}

function send(data) {
  if (state.ws?.readyState === WebSocket.OPEN) state.ws.send(JSON.stringify(data));
}

async function handleMessage(msg) {
  switch (msg.type) {
    case 'welcome':
      updateStandby(msg.serverInfo);
      break;

    case 'display-welcome':
      state.devices = msg.devices || [];
      renderWall();
      updateStandby(msg.serverInfo);
      break;

    case 'device-list':
      state.devices = msg.devices || [];
      renderWall();
      break;

    case 'initiate-rtc':
      await initiateRtc(msg.deviceId);
      break;

    case 'stream-ended':
      closePeer(msg.deviceId);
      break;

    case 'clear-display':
      for (const id of [...state.pcs.keys()]) closePeer(id);
      wall.innerHTML = '';
      break;

    case 'rtc-answer': {
      const pc = state.pcs.get(msg.fromDeviceId);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.answer));
      break;
    }

    case 'rtc-ice': {
      const pc = state.pcs.get(msg.fromDeviceId);
      if (pc && msg.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }
        catch (e) { console.warn('ICE error', e); }
      }
      break;
    }

    case 'reload':
      location.reload();
      break;
  }
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.ws?.readyState !== WebSocket.OPEN) connect();
});

document.addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
}, { once: true });

connect();
</script>
</body>
</html>
